<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parlons email test</title><style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:24px}input,button{font:inherit;padding:12px;margin-top:8px}input{width:100%;box-sizing:border-box}button{cursor:pointer}#status{margin-top:20px;white-space:pre-wrap}</style></head><body><h1>Parlons email test</h1><p>Temporary admin test. Enter the test token you created in Vercel. Do not share it.</p><input id="token" type="password" autocomplete="off" placeholder="Test token"><br><button id="send">Send test email</button><div id="status"></div><script>document.getElementById('send').onclick=async()=>{const token=document.getElementById('token').value;const s=document.getElementById('status');s.textContent='Sending…';try{const r=await fetch('/api/resend-test',{method:'POST',headers:{'x-parlons-test-token':token}});const d=await r.json().catch(()=>({}));s.textContent=r.ok?'Test email sent successfully. Check your inbox (and spam).':`Test failed (${r.status}): ${d.error||'Unknown error'}`;}catch(e){s.textContent='Test failed: '+e.message;}};</script></body></html>
